spring.application.name=conexa-star-wars
server.port=${PORT:8080}
spring.mvc.problemdetails.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
swapi.base-url=${SWAPI_BASE_URL:https://www.swapi.tech/api}
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=10s
swapi.circuit.open-wait=10s

app.jwt.private-key-b64=${JWT_PRIVATE_KEY_B64}
app.jwt.public-key-b64=${JWT_PUBLIC_KEY_B64}
app.jwt.issuer=${JWT_ISSUER}
app.jwt.audience=${JWT_AUDIENCE}

quota.login.permits=5
quota.catalog.permits=60
quota.refresh-period=1m
quota.maximum-identities=10000
server.forward-headers-strategy=none

logging.structured.format.console=logstash
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.tracing.sampling.probability=0.1
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORT_ENABLED:false}
management.logging.export.otlp.enabled=false
management.otlp.metrics.export.enabled=false
management.observations.enable.spring.security=false
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,3s,10s
management.metrics.distribution.slo.http.client.requests=50ms,100ms,250ms,500ms,1s,3s,10s
