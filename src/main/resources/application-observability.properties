# Local-only diagnostics. Do not activate this profile on a public deployment.
management.server.port=${MANAGEMENT_PORT:9091}
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.add-additional-paths=true
management.tracing.sampling.probability=1.0
management.tracing.export.otlp.enabled=${OTEL_TRACES_EXPORT_ENABLED:false}
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:http://127.0.0.1:4318/v1/traces}
management.otlp.metrics.export.enabled=${OTEL_METRICS_EXPORT_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://127.0.0.1:4318/v1/metrics}
management.otlp.metrics.export.step=5s
